name: release
# Creates a source tarball and GitHub release when a version tag is pushed,
# then opens a Homebrew formula update for giza-x11.
# Daniel Price, Aug 2020
on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Get version
      env:
          vernum: ${{ github.ref }}
          repo: ${{ github.repository }}
      run: |
          echo "version=${vernum/refs\/tags\//}" >> $GITHUB_ENV
          echo "repo=$(basename ${repo})" >> $GITHUB_ENV
          echo "tarfile=$(basename ${repo})-${vernum/refs\/tags\//}.tar.gz" >> $GITHUB_ENV

    - name: build tarball
      env:
          tarfile: ${{ env.tarfile }}
          repo: ${{ env.repo }}
      run: |
          echo "tarfile is $tarfile, repo is $repo"
          # COPYFILE_DISABLE keeps AppleDouble files out of the archive.
          # -s renames the archive root from "." to the repository name.
          COPYFILE_DISABLE=1 tar cfz /tmp/$tarfile --exclude ".git*" \
              -s "/./${repo}/" .

    - name: check tarball and get SHA
      env:
          tarfile: ${{ env.tarfile }}
      run: |
          mv /tmp/$tarfile .
          tar tfz $tarfile
          echo "sha=$(shasum -a 256 $tarfile | awk '{printf $1}')" >> $GITHUB_ENV

    - name: Create Release
      env:
          GH_TOKEN: ${{ github.token }}
          tarfile: ${{ env.tarfile }}
          version: ${{ env.version }}
      run: |
          gh release create "$version" "$tarfile" \
              --title "$version" \
              --notes-file LATEST.md

    - name: Bump Homebrew formula
      if: github.repository == 'danieljprice/giza'
      continue-on-error: true
      env:
        HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.BREW_TOKEN }}
        version: ${{ env.version }}
        sha: ${{ env.sha }}
        tarfile: ${{ env.tarfile }}
        brewtap: danieljprice/all
        formula: giza-x11
      run: |
        git config --global user.email "daniel.price@monash.edu"
        git config --global user.name "Daniel Price"
        brew tap $brewtap
        brew trust $brewtap
        brew bump-formula-pr --force --no-browse --no-audit --no-fork \
          --version="${version#v}" \
          --sha256="${sha}" \
          --url="https://github.com/${{ github.repository }}/releases/download/${version}/${tarfile}" \
          $brewtap/$formula
